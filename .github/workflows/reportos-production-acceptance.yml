name: ReportOS Production Acceptance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reportos-production-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reportos-production-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Production acceptance
        env:
          REPORTOS_PRODUCTION_URL: https://reportos.reportosnoc.workers.dev
        run: node scripts/production-acceptance.mjs
